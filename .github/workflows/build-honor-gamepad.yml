name: Build Shizuku-Free External Gamepad APK

on:
  push:
    branches:
      - build/cursor-idle-v13-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Apache-2.0 Android base
        run: |
          git clone --depth 1 https://github.com/pgratz1/AR-Touchpad.git upstream
      - name: Build native accessibility variant without Shizuku
        run: python3 tools/build_noshizuku.py
      - name: Add configurable buttons, drag and scrolling
        run: python3 tools/patch_controls.py
      - name: Remove touch-fling scrolling and add two speed sliders
        run: python3 tools/patch_no_inertia.py
      - name: Fix A left click hold and X context menu
        run: python3 tools/patch_ax.py
      - name: Fix gestures and scrolling v0.13
        run: python3 tools/patch_v08.py
      - name: Correct A tap vs hold v0.9
        run: python3 tools/patch_v09.py
      - name: Moonlight input passthrough v0.10
        run: python3 tools/patch_v10.py
      - name: Pass Start and Select through v0.11
        run: python3 tools/patch_v11.py
      - name: Restore combo v0.12
        run: python3 tools/patch_v12.py
      - name: Fix cursor inactivity v0.13
        run: python3 tools/patch_v13.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK, NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Manette-Ecran-Externe-SANS-SHIZUKU-v0.8
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
