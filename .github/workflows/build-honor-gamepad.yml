name: Build Shizuku-Free External Gamepad APK

on:
  push:
    branches:
      - build/honor-gamepad-mouse-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Apache-2.0 Android base
        run: |
          git clone --depth 1 https://github.com/pgratz1/AR-Touchpad.git upstream
      - name: Build native accessibility variant without Shizuku
        run: python3 tools/build_noshizuku.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required SDK, NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Manette-Ecran-Externe-SANS-SHIZUKU-v0.4.1
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
