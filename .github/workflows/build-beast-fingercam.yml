name: Build Beast FingerCam Viture USB
on:
  push:
    branches:
      - build/beast-fingercam-android-20261031
  workflow_dispatch:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK, NDK and CMake
        run: |
          SDK_MANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Android APK without Gradle or Maven
        run: bash scripts/build-native-without-gradle.sh
      - name: Upload APK and local signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: BeastFingerCam-v0.5-native-stage1
          path: |
            manual-build/apk/*.apk
            manual-build/signing-tools/apksigner.jar
            manual-build/signing-tools/zipalign
          retention-days: 7
