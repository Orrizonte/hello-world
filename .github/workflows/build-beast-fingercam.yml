name: Build Beast FingerCam diagnostic
on:
  push:
    branches:
      - build/beast-fingercam-android-20261031
  workflow_dispatch:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install native tools
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Download Viture Android SDK for private build
        run: |
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          url = "https://raw.githubusercontent.com/janspants11/viture-headlock/main/VITURE_XR_Glasses_SDK_for_Android.zip"
          print("Fetching Viture SDK from a public third-party mirror for ephemeral build only.")
          urllib.request.urlretrieve(url, "/tmp/viture_sdk.zip")
          print("SDK bytes:", Path("/tmp/viture_sdk.zip").stat().st_size)
          PY
          python3 prepare_sdk.py /tmp/viture_sdk.zip
          rm -f /tmp/viture_sdk.zip
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: BeastFingerCam-v0.3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
