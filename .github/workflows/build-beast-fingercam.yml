name: Build Beast FingerCam Viture USB
on:
  push:
    branches:
      - build/beast-fingercam-android-20261031
      - build/beast-auto-phone-fingertips-20261031
      - build/beast-fingers-pixels-v084-20261031
  workflow_dispatch:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Android SDK, NDK and CMake
        run: |
          SDK_MANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Prepare offline MediaPipe hand tracking
        run: bash scripts/prepare-mediapipe.sh
      - name: Build Android APK without Gradle or Maven
        run: bash scripts/build-native-without-gradle.sh
      - name: Include Android C++ runtime
        run: |
          mkdir -p manual-build/runtime
          cp "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" manual-build/runtime/libc++_shared.so
      - name: Upload APK and local signing utilities
        uses: actions/upload-artifact@v4
        with:
          name: BeastFingerCam-v0.8.4-stage1
          path: |
            manual-build/apk/*.apk
            manual-build/signing-tools/apksigner.jar
            manual-build/signing-tools/zipalign
            manual-build/runtime/libc++_shared.so
          retention-days: 7
