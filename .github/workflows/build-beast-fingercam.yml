name: Build Beast FingerCam diagnostic
on:
  push:
    branches:
      - build/beast-fingercam-android-20261031
  workflow_dispatch:
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: |
          SDK_MANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: BeastFingerCam-v0.4-Camera2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
