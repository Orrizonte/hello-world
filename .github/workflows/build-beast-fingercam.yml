name: Build Beast Fingers APK
on:
  push:
    branches:
      - build/beast-fingers-v09-20261031
  workflow_dispatch:
permissions:
  contents: write   # publishes the APK + log to the ci-output branch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build (SDK, NDK, libusb, libuvc, MediaPipe, APK, bench)
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            SDKM=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
            mkdir -p deps
            git clone --quiet https://github.com/libusb/libusb deps/libusb
            git -C deps/libusb checkout --quiet d52e355daa09f17ce64819122cb067b8a2ee0d4b
            git clone --quiet https://github.com/libuvc/libuvc deps/libuvc
            git -C deps/libuvc checkout --quiet 448d78b9aa4f54172c1ca5b5d1b4a6b9b93f7957
            bash scripts/prepare-mediapipe.sh
            bash scripts/build-apk.sh deps/libusb deps/libuvc
            mkdir -p bench/out
            P=app/src/main/java/fr/externalscreen/beastfingerdiagnostic
            javac -d bench/out $P/ScreenTracker.java $P/Homography.java $P/OneEuroFilter.java $P/Contours.java \
                $P/FingerSegmenter.java $P/FrameProcessor.java tools/SyntheticBench.java
            for s in early early-frame early-dark-frame-small early-bright-frame early-bright-frame-small-fast late-nolm; do
              java -Djava.awt.headless=true -cp bench/out SyntheticBench $s | tail -1
            done
          } 2>&1 | tee build.log
      - name: Publish to ci-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p publish
          cp build.log publish/ 2>/dev/null || echo "no log" > publish/build.log
          cp manual-build/apk/beast-fingers-*-unsigned.apk publish/ 2>/dev/null || true
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" publish/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > publish/SOURCE.txt
          cd publish
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output
